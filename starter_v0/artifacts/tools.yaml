# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: |
      Hỏi lại người dùng khi thiếu thông tin bắt buộc mà không thể suy ra được (ví dụ: chưa biết screenname, URL, hoặc cần xác nhận trước khi gửi/đăng).
      Dùng response_type="text" để hỏi thông tin.
      Dùng response_type="yes_no" khi cần xác nhận hành động (gửi, đăng).
      KHÔNG đoán bừa khi thiếu arg bắt buộc.
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: |
      Lấy các bài đăng gần đây của một tài khoản Twitter cụ thể.
      Dùng khi user hỏi về tweet/post của MỘT NGƯỜI cụ thể.
      Trước khi gọi, map tên thường thành handle: Sam Altman→sama, Elon Musk→elonmusk, Andrej Karpathy→karpathy.
      Nếu không biết handle và user chưa đặt tên ai, gọi clarify để hỏi, KHÔNG tự đoán.
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: |
      Tìm kiếm bài đăng theo chủ đề trên mạng xã hội (Twitter).
      Dùng khi user hỏi "mọi người đang bàn gì về X" hoặc tìm tweet theo từ khóa.
      Dùng search_type="Top" khi user nói "phổ biến", "top", "nổi bật nhất"; mặc định là "Latest".
      KHÔNG dùng tool này để lấy tweet của một người cụ thể (dùng timeline thay thế).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: |
      Tìm kiếm thông tin trên internet (web search).
      Dùng cho tin tức, sự kiện, kiến thức chung.
      QUAN TRỌNG về args:
      - query: CHỆ chứa từ khóa chủ đề (ví dụ "AI", "robotics"). KHÔNG gộp từ như "news", "hôm nay", "tuần này" vào query.
      - topic: Đặt thành "news" nếu request đề cập đến tin tức/báo chí; mặc định là "general".
      - timeframe: "hôm nay" / "today" → "day"; "tuần này" → "week"; "tháng này" → "month".
      KHÔNG dùng tool này nếu user đã cho URL (dùng fetch thay thế).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: |
      Đọc nội dung từ một URL cụ thể.
      Dùng khi user đã cung cấp link (ví dụ "tóm tắt bài này: https://...").
      Nếu user nói "bài này" nhưng chưa có URL, gọi clarify để hỏi link, KHÔNG tự đoán URL.
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: |
      Gửi một đoạn văn bản đi (ví dụ Telegram).
      BOUNDARY QUAN TRỌNG: Trước khi gọi send, BẮT BUỘC gọi clarify(response_type="yes_no") để xác nhận với user.
      KHÔNG tự gửi mà không có xác nhận rõ ràng.
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: |
      Tìm bài báo khoa học trên arXiv.
      Dùng khi user muốn tìm paper/nghiên cứu học thuật, không phải tin tức thường (dùng lookup cho tin tức).
      QUAN TRỌNG về args:
      - query: giữ nguyên đúng từ khóa/thuật ngữ user đưa ra (ví dụ "LLM"). KHÔNG tự diễn giải hoặc mở rộng thành cụm dài hơn (ví dụ KHÔNG đổi "LLM" thành "large language models LLM").
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]
